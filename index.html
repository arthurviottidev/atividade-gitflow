<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedra, Papel e Tesoura</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            font-family: system-ui, sans-serif;
            background: #fafafa;
            color: #222;
        }
        h1 { font-weight: 500; margin: 0; }
        #buttons { display: flex; gap: 12px; }
        button {
            padding: 12px 20px;
            font-size: 16px;
            border: 1px solid #222;
            background: transparent;
            cursor: pointer;
            border-radius: 6px;
        }
        button:hover { background: #222; color: #fafafa; }
        #result { min-height: 24px; }
        #score { color: #777; }
    </style>
</head>
<body>
<h1>Pedra, Papel e Tesoura</h1>
<div id="buttons"></div>
<p id="result"></p>
<p id="score">Você 0 x 0 CPU</p>
<script src="index.js" defer></script>
</body>
</html>
